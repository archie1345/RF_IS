services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfis-stage-server
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "RF_IS Stage"
      APP_ENV: staging
      APP_DEBUG: "true"
      APP_URL: http://100.72.97.77:8082
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: rf_is
      DB_USERNAME: rf_user
      DB_PASSWORD: rf_password
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      VITE_APP_NAME: "RF_IS Stage"
    command: >
      sh -lc "
      if [ -z \"$${APP_KEY:-}\" ]; then
        [ -f .env ] || cp .env.example .env;
        php artisan key:generate --force;
      fi;
      php artisan storage:link || true;
      php artisan config:clear || true;
      php artisan route:clear || true;
      php artisan view:clear || true;
      php artisan migrate --force;
      php artisan config:cache || true;
      php artisan route:cache || true;
      php artisan view:cache || true;
      apache2-foreground
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: mysql:8.4
    container_name: rfis-stage-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rf_is
      MYSQL_USER: rf_user
      MYSQL_PASSWORD: rf_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - rfis_stage_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_password || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  rfis_stage_db_data:
