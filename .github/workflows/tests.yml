name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.27'
          tools: composer:2.10.3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Pin npm and replace its vulnerable bundled undici
        run: |
          npm install --global npm@12.2.1
          sh scripts/install-patched-npm-undici.sh
          test "$(npm --version)" = "12.2.1"
          npm_global="$(npm root -g)"
          test "$(node -p "require('${npm_global}/npm/node_modules/undici/package.json').version")" = "6.29.1"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Generate Wayfinder route types
        run: php artisan wayfinder:generate --with-form

      - name: Verify Laravel configuration and routes
        env:
          CACHE_STORE: file
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          DB_URL: ''
        run: |
          php artisan config:cache
          php artisan route:list --except-vendor
          php artisan view:cache
          php artisan optimize:clear

      - name: Run frontend quality and production build
        run: npm run quality

      - name: Run backend formatting and tests
        run: composer test
