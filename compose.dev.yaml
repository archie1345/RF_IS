name: ${COMPOSE_PROJECT_NAME:-rf-is-dev}

x-app-common: &app-common
  image: ${APP_IMAGE:-rf-is:dev}
  build:
    context: .
    dockerfile: Dockerfile.dev
  env_file:
    - ${APP_ENV_FILE:-.env}

services:
  test:
    image: ${APP_IMAGE:-rf-is:dev}
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - testing
    working_dir: /var/www/html
    network_mode: none
    read_only: true
    user: "${APP_DEV_UID:-1000}:${APP_DEV_GID:-1000}"
    volumes:
      - .:/var/www/html:ro
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/www/html/storage:mode=1777,size=64m
      - /var/www/html/bootstrap/cache:mode=1777,size=16m
      - /var/www/html/vendor/pestphp/pest/.temp:mode=1777,size=16m
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_MAINTENANCE_DRIVER: file
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: "null"
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stderr
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - mkdir -p /tmp/laravel storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing storage/logs bootstrap/cache && sh tests/run-isolated.sh --cache-directory=/tmp/phpunit-cache

  server:
    <<: *app-common

    container_name: ${APP_CONTAINER_NAME:-rf-server}
    restart: unless-stopped

    environment:
      DEBUGBAR_ENABLED: ${DEBUGBAR_ENABLED:-false}
      TRUSTED_PROXIES: ${DEV_TRUSTED_PROXIES:-172.19.0.1}
      MAIL_MAILER: smtp
      MAIL_SCHEME: ""
      MAIL_URL: "null"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""

    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-9200}:80"

    volumes:
      - .:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zz-development.ini:ro

    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

    command:
      - /bin/sh
      - -ec
      - |
          umask 0002

          dev_gid="$${APP_DEV_GID:-1000}"
          group_name="$$(getent group "$$dev_gid" | cut -d: -f1 || true)"

          if [ -z "$$group_name" ]; then
            groupadd --gid "$$dev_gid" appdev
            group_name=appdev
          fi

          usermod -a -G "$$group_name" www-data

          composer install --no-interaction --no-progress --prefer-dist

          mkdir -p /tmp/laravel storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chown -R www-data:"$$group_name" /tmp/laravel storage bootstrap/cache
          find /tmp/laravel storage bootstrap/cache -type d -exec chmod 2775 {} +
          find /tmp/laravel storage bootstrap/cache -type f -exec chmod 0664 {} +

          php -r 'if (!is_writable(sys_get_temp_dir())) { fwrite(STDERR, sys_get_temp_dir()." is not writable\n"); exit(1); }'

          php artisan storage:link || true
          CACHE_STORE=file php artisan optimize:clear

          exec apache2-foreground

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost/up >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  scheduler:
    <<: *app-common

    container_name: ${SCHEDULER_CONTAINER_NAME:-rf-scheduler}
    restart: unless-stopped
    working_dir: /var/www/html

    healthcheck:
      disable: true

    volumes:
      - .:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zz-development.ini:ro

    depends_on:
      server:
        condition: service_healthy

    command:
      - /bin/sh
      - -ec
      - |
          exec php artisan schedule:work --verbose --no-interaction

  vite:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend-build

    container_name: ${VITE_CONTAINER_NAME:-rf-vite}
    restart: unless-stopped
    working_dir: /var/www/html

    ports:
      - "${VITE_BIND_ADDRESS:-127.0.0.1}:${VITE_PORT:-9201}:${VITE_PORT:-9201}"

    volumes:
      - .:/var/www/html
      - vite_node_modules:/var/www/html/node_modules

    environment:
      APP_URL: ${APP_URL:-http://localhost:9200}
      APP_DEV_GID: ${APP_DEV_GID:-1000}
      VITE_PORT: ${VITE_PORT:-9201}
      VITE_HOST: ${VITE_HOST:-0.0.0.0}
      VITE_DEV_SERVER_URL: ${VITE_DEV_SERVER_URL:-http://localhost:9201}
      VITE_HMR_ENABLED: ${VITE_HMR_ENABLED:-true}

    command:
      - /bin/sh
      - -ec
      - |
          umask 0002
          dev_uid="$${APP_DEV_UID:-1000}"
          dev_gid="$${APP_DEV_GID:-1000}"
          dev_home=/tmp/rfis-vite-home
          command -v setpriv >/dev/null || { echo 'setpriv is required to run Vite as the host development user.' >&2; exit 1; }
          for generated in resources/js/actions resources/js/routes resources/js/wayfinder; do
            mkdir -p "$$generated"
            chown -R "$$dev_uid:$$dev_gid" "$$generated"
            find "$$generated" -type d -exec chmod 2775 {} +
            find "$$generated" -type f -exec chmod 0664 {} +
          done
          mkdir -p "$$dev_home"
          chown -R "$$dev_uid:$$dev_gid" node_modules "$$dev_home"
          setpriv --reuid="$$dev_uid" --regid="$$dev_gid" --clear-groups -- env HOME="$$dev_home" npm run install:locked
          exec setpriv --reuid="$$dev_uid" --regid="$$dev_gid" --clear-groups -- env HOME="$$dev_home" npm run dev -- --host "$$VITE_HOST" --port "$$VITE_PORT"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(process.env.VITE_PORT, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  db:
    image: ${MYSQL_IMAGE:-rf-is:mysql-8.4.13}
    build:
      context: .
      dockerfile: Dockerfile.mysql
      args:
        MYSQL_BASE_IMAGE: ${MYSQL_BASE_IMAGE:-mysql:8.4.13}

    container_name: ${DB_CONTAINER_NAME:-rf-db}
    restart: unless-stopped

    ports:
      - "${DEV_TOOL_BIND_ADDRESS:-127.0.0.1}:${DB_FORWARD_PORT:-9203}:3306"

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  phpmyadmin:
    image: ${PHPMYADMIN_IMAGE:-rf-is:phpmyadmin}
    build:
      context: .
      dockerfile: Dockerfile.phpmyadmin
      args:
        PHPMYADMIN_BASE_IMAGE: ${PHPMYADMIN_BASE_IMAGE:-phpmyadmin:5.2.3-apache}

    container_name: ${PHPMYADMIN_CONTAINER_NAME:-rf-phpmyadmin}
    restart: unless-stopped

    ports:
      - "${DEV_TOOL_BIND_ADDRESS:-127.0.0.1}:${PHPMYADMIN_PORT:-9202}:80"

    environment:
      PMA_HOST: ${DB_HOST:-db}
      PMA_PORT: ${DB_PORT:-3306}
      PMA_USER: ${DB_USERNAME:-laravel}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT:-128M}

    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.32.0}
    container_name: ${MAILPIT_CONTAINER_NAME:-rf-mailpit}
    restart: unless-stopped

    ports:
      - "${DEV_TOOL_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_WEB_PORT:-9204}:8025"
      - "${DEV_TOOL_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  db_data:
    name: ${DB_VOLUME_NAME:-rf_is_dev_db-data}

  vite_node_modules:
    name: ${VITE_NODE_MODULES_VOLUME_NAME:-rf_vite_node_modules}
