services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rf-server
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}

      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      VITE_DEV_SERVER_URL: ${VITE_DEV_SERVER_URL}
    command: >
      sh -c "
      composer install --ignore-platform-req=php &&
      if [ -z \"$$APP_KEY\" ]; then php artisan key:generate --force; fi &&
      (php artisan storage:link || true) &&
      php artisan migrate --force &&
      apache2-foreground
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  vite:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-build
    container_name: rf-vite
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${VITE_PORT}:9201"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    command: >
      sh -c "
      npm install &&
      npm run dev -- --host 0.0.0.0 --port 9201
      "
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9201' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  db:
    image: mysql:8.4
    container_name: rf-db
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - rf_is_db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rf-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  rf_is_db-data:
