services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rf-server
    restart: unless-stopped
    ports:
      - "9200:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:9200
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: rf_is
      DB_USERNAME: rf_user
      DB_PASSWORD: rf_password
      VITE_DEV_SERVER_URL: http://127.0.0.1:9201
    command: >
      sh -c "
      composer install --ignore-platform-req=php &&
      php artisan key:generate --force &&
      php artisan storage:link &&
      php artisan migrate --force &&
      apache2-foreground
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  vite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rf-vite
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "9201:9201"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    command: >
      sh -c "
      npm install &&
      npm run dev -- --host 0.0.0.0 --port 9201
      "
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9201' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  db:
    image: mysql:8.4
    container_name: rf-db
    restart: unless-stopped
    ports:
      - "9203:3306"
    environment:
      MYSQL_DATABASE: rf_is
      MYSQL_USER: rf_user
      MYSQL_PASSWORD: rf_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - rf_is_db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_password || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rf-phpmyadmin
    restart: unless-stopped
    ports:
      - "9202:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: rf_user
      PMA_PASSWORD: rf_password
    depends_on:
      db:
        condition: service_healthy

volumes:
  rf_is_db-data:
