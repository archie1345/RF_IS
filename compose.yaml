# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
    container_name: rf-server
    ports:
      - "9200:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://127.0.0.1:9200
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=rf_is
      - DB_USERNAME=rf_user
      - DB_PASSWORD=rf_password
      - VITE_DEV_SERVER_URL=http://127.0.0.1:9201
    command: >
      sh -c "
      git config --global --add safe.directory /var/www/html &&
      /usr/local/bin/composer install --no-interaction --prefer-dist &&
      php artisan migrate --force &&
      chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache &&
      chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache &&
      apache2-foreground
      "

  vite:
    build:
      context: .
    container_name: rf-vite
    working_dir: /var/www/html
    ports:
      - "9201:9201"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - CHOKIDAR_USEPOLLING=true
  db:
    image: mysql:8.4
    restart: always
    container_name: rf-db
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=rf_is
      - MYSQL_USER=rf_user
      - MYSQL_PASSWORD=rf_password
      - MYSQL_ROOT_PASSWORD=root_password
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    container_name: rf-phpmyadmin
    ports:
      - "9202:80"
    depends_on:
      - db
    environment:
      - PMA_HOST=db
      - PMA_USER=rf_user
      - PMA_PASSWORD=rf_password

volumes:
  db-data:

